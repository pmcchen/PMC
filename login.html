
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Masuk | Salasilah Keluarga Pok Mark Chendol</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Georgia, serif;
      background: #eee5d3;
      color: #493525;
    }
    .panel {
      width: 100%;
      max-width: 430px;
      padding: 38px;
      background: #fffaf0;
      border: 1px solid #d7c39c;
      border-radius: 16px;
      box-shadow: 0 12px 40px #59452b22;
    }
    h1 { text-align: center; font-size: 25px; margin-bottom: 8px; }
    .subtitle { text-align: center; color: #8b7355; margin-bottom: 28px; }
    label { display: block; margin: 16px 0 7px; font-weight: bold; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cdbb9a;
      border-radius: 8px;
      background: #fffdf8;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 23px;
      border: 0;
      border-radius: 8px;
      background: #79552e;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    a { color: #8b642f; }
    .links { text-align: center; margin-top: 22px; }
    #mesej { margin-top: 18px; text-align: center; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Salasilah Keluarga</h1>
    <div class="subtitle">POK MARK CHENDOL</div>

    <form id="loginForm">
      <label for="email">Alamat Emel</label>
      <input id="email" type="email" required autocomplete="email">

      <label for="password">Kata Laluan</label>
      <input id="password" type="password" required
             autocomplete="current-password">

      <button id="loginButton" type="submit">LOG MASUK</button>
    </form>

    <div id="mesej" role="status"></div>

    <div class="links">
      Belum mempunyai akaun?
      <a href="daftar.html">Daftar di sini</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>

  <script>
    const form = document.getElementById("loginForm");
    const mesej = document.getElementById("mesej");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async function(e) {
      e.preventDefault();
      button.disabled = true;
      mesej.textContent = "Sedang mengesahkan akaun...";

      try {
        await window.logMasuk(
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
      } catch (error) {
        mesej.textContent = error.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
