
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salasilah Keluarga | Pok Mark Chendol</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/sidebar.css">

  <style>
    :root {
      --wood: #382719;
      --wood2: #493525;
      --wood3: #59422d;
      --gold: #c5a46a;
      --gold-light: #e8d3a6;
      --cream: #f5efe2;
      --paper: #fffaf0;
      --green: #405844;
      --text: #493525;
      --muted: #8b7658;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(ellipse at top, rgba(197,164,106,.12), transparent 55%),
        var(--cream);
      color: var(--text);
    }

    /* TOPBAR - SAMA SEPERTI DASHBOARD */

    .topbar {
      position: sticky;
      top: 0;
      z-index: 900;
      height: 72px;
      padding: 0 30px;
      background: rgba(255,250,240,.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #dfcfad;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 3px 12px rgba(73,53,37,.05);
    }

    .topbar-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .topbar-title h1 {
      font-family: 'Playfair Display', serif;
      font-size: 19px;
      margin: 0;
      color: var(--wood);
    }

    .topbar-title p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-mark {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #e9ddc4;
      border: 1px solid var(--gold);
      display: grid;
      place-items: center;
      color: var(--wood);
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 700;
    }

    .logout-btn {
      border: 1px solid var(--gold);
      background: var(--wood2);
      color: white;
      border-radius: 6px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: 600;
      font-size: 11px;
      transition: .2s;
    }

    .logout-btn:hover {
      background: #795b39;
    }

    /* KANDUNGAN */

    main {
      max-width: 1250px;
      margin: auto;
      padding: 25px 30px 50px;
    }

    /* TOOLBAR */

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 25px;
      padding: 17px 20px;
      background: var(--paper);
      border: 1px solid #dfcfad;
      border-radius: 10px;
      box-shadow: 0 4px 13px rgba(73,53,37,.04);
    }

    .toolbar a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #fff8e9;
      background: var(--wood2);
      border: 1px solid var(--gold);
      padding: 11px 16px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      transition: .2s;
    }

    .toolbar a:hover {
      background: #795b39;
      transform: translateY(-1px);
    }

    .toolbar input {
      width: min(100%, 320px);
      padding: 11px 14px;
      border: 1px solid #dfcfad;
      border-radius: 6px;
      background: #fffdf7;
      color: var(--wood);
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      outline: none;
      transition: .2s;
    }

    .toolbar input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(197,164,106,.14);
    }

    /* PENGENALAN */

    .intro {
      text-align: center;
      margin: 30px 0;
      padding: 28px 20px;
      background:
        repeating-linear-gradient(
          45deg,
          rgba(228,206,159,.025) 0px,
          rgba(228,206,159,.025) 2px,
          transparent 2px,
          transparent 13px
        ),
        linear-gradient(115deg, #302218, #59422d);
      border: 1px solid var(--gold);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(73,53,37,.10);
      color: #fff8e9;
    }

    .intro h2 {
      font-family: 'Playfair Display', serif;
      color: var(--gold-light);
      font-size: clamp(23px, 3vw, 29px);
      margin: 0 0 12px;
    }

    .intro p {
      color: #e6d9c2;
      font-size: 12px;
      line-height: 1.8;
      margin: 0;
    }

    /* GENERASI */

    .generation {
      margin: 30px 0;
      padding: 25px;
      background: rgba(255,250,240,.85);
      border: 1px solid #dfcfad;
      border-radius: 12px;
      box-shadow: 0 5px 18px rgba(73,53,37,.05);
    }

    .generation-title {
      text-align: center;
      color: var(--wood);
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      margin: 0 0 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid #dfcfad;
    }

    .family-group {
      margin: 25px auto;
      max-width: 1000px;
      text-align: center;
    }

    .parents {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .connector {
      width: 2px;
      height: 28px;
      background: var(--gold);
      margin: auto;
    }

    .children {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 13px;
      border-top: 2px solid #dfcfad;
      padding-top: 22px;
      position: relative;
    }

    /* KAD AHLI */

    .person {
      width: 175px;
      padding: 16px 11px;
      background: var(--paper);
      border: 1px solid #dfcfad;
      border-bottom: 4px solid var(--gold);
      border-radius: 10px;
      cursor: pointer;
      transition: .25s;
      text-align: center;
      color: var(--wood);
      box-shadow: 0 3px 10px rgba(73,53,37,.04);
    }

    .person:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(73,53,37,.12);
      border-color: var(--gold);
    }

    .avatar {
      width: 49px;
      height: 49px;
      margin: 0 auto 10px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #e9ddc4;
      border: 1px solid var(--gold);
      color: var(--wood);
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 700;
    }

    .person strong {
      display: block;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      line-height: 1.6;
      color: var(--wood);
    }

    .person small {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.5;
    }

    .spouse-label {
      color: var(--gold);
      font-weight: bold;
      font-size: 19px;
    }

    /* SUSUNAN PASANGAN GENERASI 1 */

    .parents-row {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
    }

    .parents-row .person {
      flex: 0 1 175px;
    }

    .parents-row .spouse-label {
      flex: 0 0 auto;
    }

    /* MESEJ */

    #mesej {
      text-align: center;
      padding: 18px;
      color: var(--wood);
      font-size: 13px;
      line-height: 1.8;
    }

    /* MODAL PROFIL */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(20,13,8,.65);
      backdrop-filter: blur(3px);
      padding: 20px;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      width: min(100%, 460px);
      max-height: 85vh;
      overflow-y: auto;
      background: var(--paper);
      border: 1px solid var(--gold);
      border-top: 5px solid var(--gold);
      border-radius: 12px;
      padding: 28px;
      position: relative;
      box-shadow: 0 15px 45px rgba(0,0,0,.22);
    }

    .modal-content h3 {
      font-family: 'Playfair Display', serif;
      color: var(--wood);
      padding-right: 25px;
    }

    .modal-content p {
      color: var(--text);
      font-size: 12px;
      line-height: 1.9;
    }

    .close {
      position: absolute;
      right: 15px;
      top: 12px;
      width: 32px;
      height: 32px;
      border: 1px solid #dfcfad;
      border-radius: 50%;
      background: #eee2c9;
      color: var(--wood);
      font-size: 21px;
      cursor: pointer;
      transition: .2s;
    }

    .close:hover {
      background: var(--wood2);
      color: white;
    }

    /* RESPONSIVE */

    @media (max-width: 900px) {
      main {
        padding: 22px 20px 40px;
      }

      .topbar {
        padding: 0 20px;
      }
    }

    @media (max-width: 700px) {
      .topbar {
        height: 64px;
        padding: 0 13px;
      }

      .topbar-title {
        gap: 8px;
      }

      .topbar-title h1 {
        font-size: 14px;
      }

      .topbar-title p {
        font-size: 10px;
      }

      .topbar-right {
        gap: 7px;
      }

      .logout-btn {
        padding: 9px 10px;
        font-size: 10px;
      }

      .user-mark {
        display: none;
      }

      main {
        padding: 18px 13px 35px;
      }

      .toolbar {
        align-items: stretch;
        padding: 14px;
        gap: 11px;
      }

      .toolbar a {
        justify-content: center;
      }

      .toolbar input {
        width: 100%;
      }

      .intro {
        padding: 24px 15px;
        margin: 20px 0;
      }

      .generation {
        padding: 17px 9px;
        margin: 22px 0;
      }

      .generation-title {
        font-size: 19px;
      }

      .person {
        width: 145px;
        padding: 13px 8px;
      }

      .parents-row .person {
        flex-basis: 145px;
      }

      .children {
        gap: 10px;
        padding-top: 17px;
      }

      .family-group {
        margin: 20px auto;
      }

      .modal-content {
        padding: 23px 18px;
      }
    }

    @media (max-width: 360px) {
      .person {
        width: 130px;
      }

      .parents-row .person {
        flex-basis: 130px;
      }

      .generation {
        padding-left: 6px;
        padding-right: 6px;
      }
    }
  </style>
</head>

<body>

<div class="app-content">

  <!-- HEADER SAMA SEPERTI DASHBOARD -->
  <header class="topbar">

    <div class="topbar-title">
      <div>
        <h1>Salasilah Keluarga</h1>
        <p>Pok Mark Chendol · Arkib dan Warisan Keluarga</p>
      </div>
    </div>

    <div class="topbar-right">
      <div class="user-mark">م</div>
      <button class="logout-btn" id="btnKeluar">Log Keluar</button>
    </div>

  </header>

  <main>

    <!-- TOOLBAR -->
    <div class="toolbar">
      <a href="dashboard.html">← Kembali ke Dashboard</a>

      <input
        type="search"
        id="carianAhli"
        placeholder="Cari nama ahli keluarga..."
      >
    </div>

    <!-- PENGENALAN -->
    <section class="intro">
      <h2>Warisan Keturunan Keluarga</h2>
      <p>Susur galur keluarga berdasarkan rekod yang telah disahkan.</p>
    </section>

    <!-- PAPARAN SALASILAH -->
    <div id="mesej">Memuatkan salasilah keluarga...</div>
    <div id="paparanSalasilah"></div>

  </main>

</div>

<!-- MODAL PROFIL AHLI -->
<div class="modal" id="modalAhli">
  <div class="modal-content">
    <button class="close" id="tutupModal">&times;</button>
    <div id="maklumatAhli"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabase-config.js?v=4"></script>
<script src="./js/auth-guard.js?v=4"></script>
<script src="./js/salasilah.js?v=2"></script>
<script src="./js/sidebar.js?v=1"></script>

</body>
</html>
