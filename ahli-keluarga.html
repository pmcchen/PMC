
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengurusan Ahli - Salasilah Keluarga</title>

<style>
:root {
    --coklat: #563b26;
    --emas: #bd9859;
    --krim: #f5efe3;
    --putih: #fffaf0;
    --teks: #493522;
    --border: #e4d6bd;
}
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: var(--krim);
    color: var(--teks);
}

header {
    background: var(--coklat);
    color: #f8e8c4;
    padding: 22px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 23px;
}

header p {
    margin-bottom: 0;
}

main {
    max-width: 1150px;
    margin: 25px auto;
    padding: 15px;
}

.panel {
    background: var(--putih);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 3px 15px #0000000c;
}

.toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: 15px 0;
}

input, select {
    padding: 11px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: white;
    color: var(--teks);
    min-width: 150px;
}

#carian {
    flex: 1;
}

button {
    padding: 10px 15px;
    border: 0;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.btn-utama {
    background: var(--coklat);
    color: white;
}

.btn-edit {
    background: #e8d5ad;
    color: var(--teks);
}

.btn-padam {
    background: #a83d32;
    color: white;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    text-align: left;
}

th {
    background: #eee0c5;
}

.status-asal {
    color: #805a22;
    font-weight: bold;
}

.status-pengguna {
    color: #287a45;
    font-weight: bold;
}

#mesej {
    margin: 12px 0;
    font-weight: bold;
}

.profil {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    align-items: flex-start;
}

.profil img {
    width: 150px;
    height: 170px;
    object-fit: cover;
    border-radius: 10px;
    background: #eee0c5;
}

.medan {
    margin: 12px 0;
}

.medan label {
    display: block;
    margin-bottom: 6px;
    font-weight: bold;
}

.medan input, .medan select {
    width: 100%;
}

.grid-form {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0 15px;
}

[hidden] {
    display: none !important;
}

@media(max-width:650px) {
    .grid-form {
        grid-template-columns: 1fr;
    }
    main {
        padding: 10px;
    }
    .panel {
        padding: 15px;
    }
}
</style>
</head>

<body>

<header>
    <h1>SALASILAH KELUARGA POK MARK CHENDOL</h1>
    <p>Pengurusan Ahli Keluarga</p>
</header>

<main>

    <section class="panel">
        <h2>Senarai Ahli Keluarga</h2>

        <div class="toolbar">
            <input
                type="search"
                id="carian"
                placeholder="Cari nama ahli keluarga..."
            >

            <select id="tapisGenerasi">
                <option value="">Semua Generasi</option>
            </select>

            <button class="btn-utama" id="btnMuatSemula">
                Muat Semula
            </button>
        </div>

        <div id="mesej">Memuatkan senarai ahli...</div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Nama Ahli</th>
                        <th>Generasi</th>
                        <th>Status</th>
                        <th>Jenis Rekod</th>
                        <th>Tindakan</th>
                    </tr>
                </thead>
                <tbody id="senaraiAhli">
                    <tr>
                        <td colspan="5">Memuatkan...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="panel" id="panelProfil" hidden>
        <h2>Profil Ahli Keluarga</h2>
        <div id="butiranProfil"></div>
    </section>

    <section class="panel" id="panelEdit" hidden>
        <h2>Kemaskini Maklumat Ahli</h2>

        <form id="formEdit">
            <input type="hidden" id="editId">

            <div class="grid-form">

                <div class="medan">
                    <label>Nama Penuh</label>
                    <input id="editNama" required>
                </div>

                <div class="medan">
                    <label>Jantina</label>
                    <select id="editJantina">
                        <option value="">Tidak dinyatakan</option>
                        <option value="LELAKI">Lelaki</option>
                        <option value="PEREMPUAN">Perempuan</option>
                    </select>
                </div>

                <div class="medan">
                    <label>Tarikh Lahir</label>
                    <input type="date" id="editLahir">
                </div>

                <div class="medan">
                    <label>Status Hidup</label>
                    <select id="editStatus">
                        <option value="HIDUP">Hidup</option>
                        <option value="MENINGGAL">Meninggal</option>
                        <option value="TIDAK DIKETAHUI">Tidak diketahui</option>
                    </select>
                </div>

                <div class="medan">
                    <label>Tarikh Meninggal</label>
                    <input type="date" id="editMeninggal">
                </div>

                <div class="medan">
                    <label>Generasi</label>
                    <input type="number" id="editGenerasi" min="1">
                </div>

                <div class="medan">
                    <label>Tempat Lahir</label>
                    <input id="editTempatLahir">
                </div>

                <div class="medan">
                    <label>Tempat Asal</label>
                    <input id="editTempatAsal">
                </div>

                <div class="medan">
                    <label>Pekerjaan</label>
                    <input id="editPekerjaan">
                </div>

                <div class="medan">
                    <label>Catatan</label>
                    <input id="editCatatan">
                </div>

            </div>

            <div class="toolbar">
                <button type="submit" class="btn-utama">
                    Simpan Perubahan
                </button>

                <button type="button" class="btn-edit" id="btnBatalEdit">
                    Batal
                </button>
            </div>
        </form>
    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./js/supabase-config.js?v=4"></script>
<script src="./js/auth.js?v=4"></script>
<script src="./js/auth-guard.js?v=4"></script>
<script src="./js/ahli-keluarga.js?v=1"></script>

</body>
</html>
